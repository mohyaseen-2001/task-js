<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Bookstore & Reading Club</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Welcome to the Community Bookstore</h1>
            <p>Your ultimate destination to register memberships, explore book genres, and borrow your favorite books.</p>
        </header>

        <main>
            <section class="book-categories">
                <div class="category-card">
                    <h3>Fiction</h3>
                    <p>Explore creative stories, novels, and imaginative adventures.</p>
                </div>
                <div class="category-card">
                    <h3>Non-Fiction</h3>
                    <p>Discover educational books, history, science, and self-development.</p>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
